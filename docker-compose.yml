services:
  book-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${BOOK_POSTGRES_DB:-mytruyen}
      POSTGRES_USER: ${BOOK_POSTGRES_USER:-mytruyen}
      POSTGRES_PASSWORD: ${BOOK_POSTGRES_PASSWORD:?set BOOK_POSTGRES_PASSWORD}
    volumes:
      - book-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOK_POSTGRES_USER:-mytruyen} -d ${BOOK_POSTGRES_DB:-mytruyen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB:-mytruyen_users}
      POSTGRES_USER: ${USER_POSTGRES_USER:-mytruyen}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD:?set USER_POSTGRES_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_POSTGRES_USER:-mytruyen} -d ${USER_POSTGRES_DB:-mytruyen_users}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mytruyen}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/${USER_POSTGRES_DB:-mytruyen_users}
      DB_USERNAME: ${USER_POSTGRES_USER:-mytruyen}
      DB_PASSWORD: ${USER_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      user-db:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    environment:
      USER_SERVICE_URL: http://user-service:8082
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      - user-service

  book-service:
    build: ./book-service
    command: ["sh", "-c", "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"]
    environment:
      PROJECT_NAME: MyTruyen Book Service
      API_V1_STR: /api/v1
      API_V2_STR: /api/v2
      POSTGRES_SERVER: book-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${BOOK_POSTGRES_DB:-mytruyen}
      POSTGRES_USER: ${BOOK_POSTGRES_USER:-mytruyen}
      POSTGRES_PASSWORD: ${BOOK_POSTGRES_PASSWORD}
      POSTGRES_URL: postgresql+asyncpg://${BOOK_POSTGRES_USER:-mytruyen}:${BOOK_POSTGRES_PASSWORD}@book-db:5432/${BOOK_POSTGRES_DB:-mytruyen}
      POSTGRES_SYNC_URL: postgresql://${BOOK_POSTGRES_USER:-mytruyen}:${BOOK_POSTGRES_PASSWORD}@book-db:5432/${BOOK_POSTGRES_DB:-mytruyen}
      POOL_SIZE: ${BOOK_DB_POOL_SIZE:-10}
      MAX_OVERFLOW: ${BOOK_DB_MAX_OVERFLOW:-20}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      JWT_SECRET_KEY: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@example.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-unused-in-book-service}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-disabled}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-mytruyen}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      RABBITMQ_QUEUE_CRAWL: ${RABBITMQ_QUEUE_CRAWL:-crawl}
    depends_on:
      book-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_started

  mytruyen-gateway:
    build: ./mytruyen-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      USER_SERVICE_URI: http://user-service:8082
      BOOK_SERVICE_URI: http://book-service:8000
    depends_on:
      - auth-service
      - user-service
      - book-service

volumes:
  book-db-data:
  user-db-data:
  meili-data:
  rabbitmq-data:
