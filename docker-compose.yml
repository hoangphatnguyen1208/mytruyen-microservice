services:
  identity-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-mytruyen_identity}
      POSTGRES_USER: ${POSTGRES_USER:-mytruyen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [identity-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mytruyen} -d ${IDENTITY_POSTGRES_DB:-mytruyen_identity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${CATALOG_POSTGRES_DB:-mytruyen_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-mytruyen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [catalog-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mytruyen} -d ${CATALOG_POSTGRES_DB:-mytruyen_catalog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  engagement-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${ENGAGEMENT_POSTGRES_DB:-mytruyen_engagement}
      POSTGRES_USER: ${POSTGRES_USER:-mytruyen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [engagement-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mytruyen} -d ${ENGAGEMENT_POSTGRES_DB:-mytruyen_engagement}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: [meili-data:/meili_data]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mytruyen}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
    ports: ["127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build: ./identity-service
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/${IDENTITY_POSTGRES_DB:-mytruyen_identity}
      DB_USERNAME: ${POSTGRES_USER:-mytruyen}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?set JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?set JWT_PUBLIC_KEY_BASE64}
      JWT_ISSUER: ${JWT_ISSUER:-mytruyen-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mytruyen-api}
      JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS:-900}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      identity-db:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    environment:
      SEARCH_SYNC_ENABLED: "true"
      DB_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_POSTGRES_DB:-mytruyen_catalog}
      DB_USERNAME: ${POSTGRES_USER:-mytruyen}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?set JWT_PUBLIC_KEY_BASE64}
      JWT_ISSUER: ${JWT_ISSUER:-mytruyen-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mytruyen-api}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-mytruyen}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  engagement-service:
    build: ./engagement-service
    environment:
      DB_URL: jdbc:postgresql://engagement-db:5432/${ENGAGEMENT_POSTGRES_DB:-mytruyen_engagement}
      DB_USERNAME: ${POSTGRES_USER:-mytruyen}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-mytruyen}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      engagement-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  search-service:
    build: ./search-service
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_SEARCH_KEY:-${MEILI_MASTER_KEY}}
      CATALOG_URL: http://catalog-service:8082
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-mytruyen}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    depends_on:
      meilisearch:
        condition: service_started
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  search-indexer:
    build: ./search-service
    command: ["python", "-m", "app.sync.worker"]
    restart: unless-stopped
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_WRITE_KEY:-${MEILI_MASTER_KEY}}
      CATALOG_URL: http://catalog-service:8082
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-mytruyen}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    depends_on:
      meilisearch:
        condition: service_started
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  ingestion-worker:
    build: ./ingestion-worker
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-mytruyen}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      INGESTION_QUEUE: mytruyen.ingestion.commands.v1
    depends_on:
      rabbitmq:
        condition: service_healthy

  mytruyen-gateway:
    build: ./mytruyen-gateway
    ports: ["${GATEWAY_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"]
    environment:
      IDENTITY_SERVICE_URI: http://identity-service:8081
      CATALOG_SERVICE_URI: http://catalog-service:8082
      ENGAGEMENT_SERVICE_URI: http://engagement-service:8083
      SEARCH_SERVICE_URI: http://search-service:8000
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?set JWT_PUBLIC_KEY_BASE64}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-mytruyen-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mytruyen-api}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      - identity-service
      - catalog-service
      - engagement-service
      - search-service

volumes:
  identity-db-data:
  catalog-db-data:
  engagement-db-data:
  meili-data:
  rabbitmq-data:
