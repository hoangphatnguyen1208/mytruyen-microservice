server:
  port: ${ENGAGEMENT_PORT:${PORT:8004}}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs

spring:
  application:
    name: engagement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mytruyen_engagement}
    username: ${DB_USERNAME:mytruyen}
    password: ${DB_PASSWORD:mytruyen}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mytruyen}
    password: ${RABBITMQ_PASSWORD:mytruyen}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
