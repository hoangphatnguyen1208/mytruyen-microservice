[project]
name = "mytruyen-ingestion-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.6.2",
    "pydantic-settings>=2.10.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
