server:
  port: ${GATEWAY_PORT:8000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs
    disable-swagger-default-url: true
    urls-primary-name: Identity
    urls:
      - name: Identity
        url: /api-docs/identity
      - name: Book
        url: /api-docs/book
      - name: Search
        url: /api-docs/search
      - name: Engagement
        url: /api-docs/engagement

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-openapi
              uri: ${IDENTITY_SERVICE_URI:http://localhost:${IDENTITY_PORT:8001}}
              predicates:
                - Path=/api-docs/identity
                - Method=GET
              filters:
                - SetPath=/v3/api-docs
            - id: book-openapi
              uri: ${CATALOG_SERVICE_URI:http://localhost:${CATALOG_PORT:8002}}
              predicates:
                - Path=/api-docs/book
                - Method=GET
              filters:
                - SetPath=/v3/api-docs
            - id: search-openapi
              uri: ${SEARCH_SERVICE_URI:http://localhost:${SEARCH_PORT:8003}}
              predicates:
                - Path=/api-docs/search
                - Method=GET
              filters:
                - SetPath=/openapi.json
            - id: engagement-openapi
              uri: ${ENGAGEMENT_SERVICE_URI:http://localhost:${ENGAGEMENT_PORT:8004}}
              predicates:
                - Path=/api-docs/engagement
                - Method=GET
              filters:
                - SetPath=/v3/api-docs
            - id: identity-auth
              uri: ${IDENTITY_SERVICE_URI:http://localhost:${IDENTITY_PORT:8001}}
              predicates:
                - Path=/api/v1/auth/**
            - id: identity-users
              uri: ${IDENTITY_SERVICE_URI:http://localhost:${IDENTITY_PORT:8001}}
              predicates:
                - Path=/api/v1/users/**
            - id: book-service
              uri: ${CATALOG_SERVICE_URI:http://localhost:${CATALOG_PORT:8002}}
              predicates:
                - Path=/api/v1/books/**,/api/v1/chapters/**,/api/v1/authors/**,/api/v1/genres/**,/api/v1/tags/**,/api/v1/book-statuses/**,/api/v1/stats/**,/api/v1/admin/catalog/**,/api/v1/internal/import/**,/api/v1/rabbitmq/**,/api/v1/worker/**
            - id: engagement-service
              uri: ${ENGAGEMENT_SERVICE_URI:http://localhost:${ENGAGEMENT_PORT:8004}}
              predicates:
                - Path=/api/v1/comments/**,/api/v1/reviews/**,/api/v1/bookmarks/**,/api/v1/ratings/**
            - id: search-service
              uri: ${SEARCH_SERVICE_URI:http://localhost:${SEARCH_PORT:8003}}
              predicates:
                - Path=/api/v1/search/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                allow-credentials: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive.function.client: INFO
    reactor.netty.http.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  public-key: ${JWT_PUBLIC_KEY_BASE64}
  algorithm: ${JWT_ALGORITHM:RS256}
  issuer: ${JWT_ISSUER:mytruyen-auth}
  audience: ${JWT_AUDIENCE:mytruyen-api}

