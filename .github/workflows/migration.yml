name: Migration verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Start a disposable Docker integration stack'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, catalog-service, mytruyen-gateway, engagement-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        if: matrix.service == 'catalog-service'
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - run: bash gradlew test bootJar --no-daemon
        working-directory: ${{ matrix.service }}
        env:
          RUN_WORKER_CONTRACT_TESTS: ${{ matrix.service == 'catalog-service' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.service }}
          path: ${{ matrix.service }}/build/test-results/test/*.xml

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
        working-directory: search-service
      - run: uv run --locked pytest -q
        working-directory: search-service

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    needs: [java, python, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: migration-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_USER: mytruyen
      BOOTSTRAP_ADMIN_ENABLED: 'true'
      BOOTSTRAP_ADMIN_EMAIL: smoke-admin@example.test
      ALLOW_DISPOSABLE_SMOKE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Generate ephemeral secrets (runner only)
        shell: bash
        run: |
          umask 077
          temp_dir=$(mktemp -d)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$temp_dir/key.pem" 2>/dev/null
          private_key=$(openssl pkcs8 -topk8 -nocrypt -in "$temp_dir/key.pem" -outform DER | base64 -w0)
          public_key=$(openssl pkey -in "$temp_dir/key.pem" -pubout -outform DER | base64 -w0)
          echo "::add-mask::$private_key"
          echo "JWT_PRIVATE_KEY_BASE64=$private_key" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$public_key" >> "$GITHUB_ENV"
          for name in POSTGRES_PASSWORD REDIS_PASSWORD MEILI_MASTER_KEY RABBITMQ_DEFAULT_PASS BOOTSTRAP_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start isolated PostgreSQL/RabbitMQ/Meilisearch stack
        run: |
          docker compose config --quiet
          docker compose up -d --build
      - name: End-to-end migration smoke test
        run: uv run --no-project --with httpx python scripts/smoke-migration.py
      - name: Verify no pending or dead-lettered search messages
        run: |
          docker compose exec -T catalog-db psql -U mytruyen -d mytruyen_catalog -tAc 'select count(*) from search_outbox where published_at is null' | grep -qx '0'
          docker compose exec -T rabbitmq rabbitmqctl list_queues name messages --formatter=json > /tmp/migration-queues.json
          python -c 'import json; q={r["name"]:r["messages"] for r in json.load(open("/tmp/migration-queues.json"))}; assert q["mytruyen.search.sync.v1"] == 0 and q["mytruyen.search.sync.v1.dead"] == 0, q'
      - name: Diagnostic logs
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Remove disposable CI stack only
        if: always()
        run: docker compose down --volumes --remove-orphans
