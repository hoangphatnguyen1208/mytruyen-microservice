server:
  port: ${PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mytruyen_identity}
    username: ${DB_USERNAME:mytruyen}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

jwt:
  private-key: ${JWT_PRIVATE_KEY_BASE64}
  public-key: ${JWT_PUBLIC_KEY_BASE64}
  issuer: ${JWT_ISSUER:mytruyen-auth}
  audience: ${JWT_AUDIENCE:mytruyen-api}
  access-seconds: ${JWT_ACCESS_SECONDS:900}
identity:
  refresh-days: ${REFRESH_TOKEN_DAYS:7}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
