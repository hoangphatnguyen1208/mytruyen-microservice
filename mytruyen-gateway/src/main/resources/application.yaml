server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**
            - id: book-service
              uri: ${BOOK_SERVICE_URI:http://localhost:8000}
              predicates:
                - Path=/api/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                allow-credentials: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive.function.client: INFO
    reactor.netty.http.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  public-key: ${JWT_PUBLIC_KEY_BASE64}
  algorithm: ${JWT_ALGORITHM:RS256}
  issuer: ${JWT_ISSUER:mytruyen-auth}
  audience: ${JWT_AUDIENCE:mytruyen-api}

