server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-auth
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: identity-users
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/books/**,/api/v1/chapters/**,/api/v1/authors/**,/api/v1/genres/**,/api/v1/tags/**,/api/v1/book-statuses/**,/api/v1/stats/**,/api/v1/admin/catalog/**,/api/v1/internal/import/**
            - id: engagement-service
              uri: ${ENGAGEMENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/comments/**,/api/v1/reviews/**,/api/v1/bookmarks/**,/api/v1/ratings/**
            - id: search-service
              uri: ${SEARCH_SERVICE_URI:http://localhost:8000}
              predicates:
                - Path=/api/v1/search/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                allow-credentials: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive.function.client: INFO
    reactor.netty.http.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  public-key: ${JWT_PUBLIC_KEY_BASE64}
  algorithm: ${JWT_ALGORITHM:RS256}
  issuer: ${JWT_ISSUER:mytruyen-auth}
  audience: ${JWT_AUDIENCE:mytruyen-api}

